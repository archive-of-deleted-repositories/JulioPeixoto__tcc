<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphRAG Climático</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: .8rem; color: #64748b; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .msg {
      max-width: 75%;
      padding: .75rem 1rem;
      border-radius: .75rem;
      line-height: 1.6;
      font-size: .95rem;
    }

    .msg.user {
      align-self: flex-end;
      background: #1e40af;
    }

    .msg.assistant {
      align-self: flex-start;
      background: #1e293b;
    }

    .msg.meta {
      align-self: flex-start;
      background: transparent;
      border: 1px solid #334155;
      font-size: .8rem;
      color: #64748b;
    }

    #form {
      display: flex;
      gap: .5rem;
      padding: 1rem 1.5rem;
      border-top: 1px solid #1e293b;
    }

    #input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: .5rem;
      color: #e2e8f0;
      padding: .6rem .9rem;
      font-size: .95rem;
      outline: none;
    }

    #input:focus { border-color: #3b82f6; }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: .5rem;
      padding: .6rem 1.2rem;
      cursor: pointer;
      font-size: .95rem;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    .typing::after {
      content: "▋";
      animation: blink .8s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    details.meta-box {
      align-self: flex-start;
      font-size: .75rem;
      color: #64748b;
      margin-top: -.5rem;
    }

    details.meta-box summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: .35rem;
      padding: .2rem .4rem;
      border-radius: .35rem;
      user-select: none;
    }

    details.meta-box summary:hover { color: #94a3b8; }

    details.meta-box summary::before {
      content: "▶";
      font-size: .6rem;
      transition: transform .15s;
    }

    details.meta-box[open] summary::before { transform: rotate(90deg); }

    .meta-body {
      margin-top: .35rem;
      padding: .5rem .75rem;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: .5rem;
      display: flex;
      flex-direction: column;
      gap: .25rem;
      min-width: 220px;
    }

    .meta-row { display: flex; gap: .5rem; }
    .meta-label { color: #475569; min-width: 90px; }
    .meta-value { color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>GraphRAG Climático</h1>
      <span>Eventos climáticos extremos no Brasil · INMET + CEMADEN</span>
    </div>
  </header>

  <div id="messages">
    <div class="msg assistant">
      Olá! Pergunte sobre eventos climáticos extremos no Brasil —
      enchentes, deslizamentos, secas, ondas de calor e mais.
      Exemplo: <em>"Quais municípios do RS tiveram mais enchentes em 2024?"</em>
    </div>
  </div>

  <form id="form">
    <input id="input" type="text" placeholder="Faça uma pergunta sobre eventos climáticos..." autocomplete="off" />
    <button type="submit" id="btn">Enviar</button>
  </form>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const btn = document.getElementById('btn');

    function addMsg(text, role, extraClass = '') {
      const div = document.createElement('div');
      div.className = `msg ${role} ${extraClass}`.trim();
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pergunta = input.value.trim();
      if (!pergunta) return;

      input.value = '';
      btn.disabled = true;
      addMsg(pergunta, 'user');

      const assistantDiv = addMsg('', 'assistant typing');

      // painel de meta — criado vazio, preenchido ao receber event:meta
      const metaDetails = document.createElement('details');
      metaDetails.className = 'meta-box';
      metaDetails.style.display = 'none';
      metaDetails.innerHTML = '<summary>contexto do grafo</summary><div class="meta-body"></div>';
      messagesEl.appendChild(metaDetails);

      function renderMeta(meta) {
        const { entidades, num_registros } = meta;
        const fmt = (arr) => arr.length ? arr.join(', ') : '—';
        const periodo = (entidades.periodos ?? []).length
          ? entidades.periodos.map(p => `${p.rotulo} (${p.inicio} → ${p.fim})`).join('  ·  ')
          : '—';
        metaDetails.querySelector('.meta-body').innerHTML = `
          <div class="meta-row"><span class="meta-label">registros</span><span class="meta-value">${num_registros}</span></div>
          <div class="meta-row"><span class="meta-label">municípios</span><span class="meta-value">${fmt(entidades.municipios)}</span></div>
          <div class="meta-row"><span class="meta-label">estados</span><span class="meta-value">${fmt(entidades.estados)}</span></div>
          <div class="meta-row"><span class="meta-label">eventos</span><span class="meta-value">${fmt(entidades.tipos_evento)}</span></div>
          <div class="meta-row"><span class="meta-label">período</span><span class="meta-value">${periodo}</span></div>
        `;
        metaDetails.style.display = '';
      }

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ pergunta }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let currentEvent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() ?? '';

          for (const line of lines) {
            if (line === '') {
              // linha em branco = fim do bloco SSE, reseta o evento
              currentEvent = '';
              continue;
            }
            if (line.startsWith('event: ')) {
              currentEvent = line.slice(7).trim();
              if (currentEvent === 'done') { assistantDiv.classList.remove('typing'); }
              continue;
            }
            if (line.startsWith('data: ')) {
              const payload = line.slice(6);
              if (currentEvent === 'meta') { try { renderMeta(JSON.parse(payload)); } catch {} }
              else if (currentEvent !== 'error' && currentEvent !== 'done') {
                assistantDiv.textContent += payload;
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            }
          }
        }
      } catch (err) {
        assistantDiv.textContent = 'Erro ao conectar com o servidor.';
        assistantDiv.classList.remove('typing');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
